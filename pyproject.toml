[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "petalgen"
version = "0.1.0"
description = "Generative ASCII flowers for your terminal — seeded, reproducible, zero dependencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Krrish" }]
keywords = ["ascii-art", "generative-art", "cli", "terminal", "flowers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
    "Topic :: Utilities",
]

[project.scripts]
petalgen = "petalgen.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/petalgen"

[tool.setuptools.packages.find]
include = ["petalgen*"]
